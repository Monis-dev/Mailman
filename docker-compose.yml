services:
  # 1. High-Speed In-Memory Broker
  redis:
    image: redis:7-alpine
    container_name: mailman-redis
    command: redis-server --appendonly yes --appendfsync everysec
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5

  # 2. Permanent Relational System of Record
  postgres:
    image: postgres:16-alpine
    container_name: mailman-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: relayengine
    volumes:
      - ./src/config/schema.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 5
  
  migrate:
    build: .
    command: node src/config/migrate.js
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=relayengine
    depends_on:
      postgres:
        condition: service_healthy

  # 3. The Ingestion API Container
  api:
    build: .
    container_name: mailman-api
    command: node src/api/server.js
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - RELAY_API_KEY=mail_man_secret_key_0909
      - RATE_LIMIT_MAX=50000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=relayengine
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - NODE_ENV=development
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # 4. The Background Worker Container
  worker:
    build: .
    container_name: mailman-worker
    command: node src/workers/mailman.js
    environment:
      - STREAM_KEY=task:stream
      - GROUP_NAME=worker-group
      - WEBHOOK_SECRET=mail001_man_webhook_qwssermxmx110
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=relayengine
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - NODE_ENV=development
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # 5. Network Chaos Testing Proxy
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.9.0
    container_name: mailman-toxiproxy
    ports:
      - "8474:8474"
      - "8500:8500"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  test-runner:
    build: .
    command: node test/run-all-chaos.js
    environment:
      - RELAY_API_KEY=mail_man_secret_key_0909
      - WEBHOOK_SECRET=mail001_man_webhook_qwssermxmx110
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=relayengine
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - GROUP_NAME=worker-group
    depends_on:
      - api
      - worker
    profiles: ["test"]